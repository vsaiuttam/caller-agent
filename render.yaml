# Render Blueprint — deploy backend as a web service with Postgres.
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/select-repo?type=blueprint
#   3. Connect your repo — Render reads this file and creates the services
#   4. Set the environment variables listed below in the Render dashboard

databases:
  - name: voiceagent-db
    plan: free
    databaseName: voiceagent
    user: voiceagent

services:
  # ---------- API + webhook server ----------
  - type: web
    name: voiceagent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.voiceagent.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Database — Supabase Postgres, set in the dashboard. Use the Session
      # pooler string (Supabase → Connect → Session pooler, port 5432): Render
      # has no IPv6, and Supabase's direct db.<ref>.supabase.co host is
      # IPv6-only. The app adds the async driver and TLS itself.
      # voiceagent-db above is the old Render database, kept only until its
      # data has been copied across (python db_tool.py copy …).
      - key: DATABASE_URL
        sync: false

      # Model provider — set at least one
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Telephony. Render re-applies fixed values here whenever this file
      # changes, overriding the dashboard — keep it matching the provider in use.
      - key: TELEPHONY
        value: twilio
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false
      - key: TELNYX_CONNECTION_ID
        sync: false
      # Auto-set to this service's URL
      - key: TELNYX_WEBHOOK_URL
        fromService:
          type: web
          name: voiceagent-api
          property: host
      - key: TELNYX_WEBHOOK_PORT
        value: "8765"

      # Twilio (if using Twilio instead of Telnyx)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # WhatsApp follow-ups (Sandbox for testing: +14155238886)
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false

      # Access control. A deploy is locked from its first visit: nobody gets in
      # without signing in, and the first registered account becomes the
      # owner. After that sign-up is invite-only unless REGISTRATION_MODE says
      # otherwise. REQUIRE_LOGIN is a fixed value on purpose — re-applied on
      # every blueprint sync, so a public console can't drift back to open.
      - key: REQUIRE_LOGIN
        value: "true"
      - key: REGISTRATION_MODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      # Encrypts connected apps' (MCP servers') URLs and headers at rest
      - key: SECRETS_KEY
        sync: false

      # CORS — your Vercel frontend URL + local dev
      - key: CORS_ORIGINS
        value: "https://frontend-nu-blond-93.vercel.app,http://localhost:5173"

      - key: LOG_LEVEL
        value: INFO
